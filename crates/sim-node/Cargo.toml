[package]
name = "sim-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js native addon (napi-rs) surface for the Logigator simulation engine."

[lib]
# A Node-API addon is a `cdylib` loaded by node at runtime (napi symbols resolve on load).
crate-type = ["cdylib"]

[dependencies]
# napi9 ⊇ Node 18+. Default features off keeps the surface lean — we use the synchronous
# binding API plus `Env::create_deferred` (a threadsafe `JsDeferred`), so no tokio runtime is needed:
# the dedicated sim thread resolves promises directly (see src/worker.rs).
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
# The engine is single-threaded; the worker drives plain `tick()` on its dedicated sim thread
# (src/worker.rs). No serde: boards arrive as napi objects or `.lgb` bytes.
sim-core = { workspace = true }

[build-dependencies]
napi-build = "2"
