# git-cliff config for `just changelog`: drafts Keep a Changelog entries from the conventional
# commits since the last tag. The draft is a starting point for CHANGELOG.md's [Unreleased]
# section, not the final text: reword entries for users and move any breaking change that
# lacks a `!` / `BREAKING CHANGE:` marker under Breaking by hand.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments order the groups; `striptags` removes them from the headings.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  { message = "^\\w+\\((test|corpus)\\)", skip = true },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^refactor\\(api\\)", group = "<!-- 2 -->Changed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  # Internal: invisible to users of the package and the CLI.
  { message = "^(refactor|chore|docs|style|test|ci|build|bench)", skip = true },
  { message = "^Revert", skip = true },
]
